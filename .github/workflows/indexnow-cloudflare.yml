name: Submit Cloudflare URLs to IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Submit sitemap URLs
        run: |
          set -e

          KEY=$(cat public/97d4ebbad7c84e3289e439522375455a.txt)

          curl -fsSL -A "Mozilla/5.0" \
            https://chifral.pages.dev/sitemap.xml -o sitemap.xml

          python3 -c "import xml.etree.ElementTree as E,json; r=E.parse('sitemap.xml').getroot(); print(json.dumps([e.text.strip() for e in r.iter() if e.tag.endswith('loc') and e.text]))" > urls.json

          COUNT=$(jq 'length' urls.json)

          jq -n \
            --arg host "chifral.pages.dev" \
            --arg key "$KEY" \
            --arg keyLocation "https://chifral.pages.dev/$KEY.txt" \
            --slurpfile urls urls.json \
            '{host:$host,key:$key,keyLocation:$keyLocation,urlList:$urls[0]}' > payload.json

          HTTP=$(curl -sS -o response.txt -w "%{http_code}" \
            -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" \
            --data-binary @payload.json)

          echo "IndexNow HTTP: $HTTP"

          case "$HTTP" in
            200|202) ;;
            *) cat response.txt; exit 1 ;;
          esac

          echo "Submitted URLs: $COUNT"

